version: '3.8'
services:
  postgres:
    image: postgres:alpine
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exchange

  redis:
    image: redis
    container_name: redis2
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data2:
  redis_data: